services:
  - type: web
    name: emmanuel-ministries
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Emmanuel Ministries
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_DATABASE
        value: neondb
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: CHURCH_ADMIN_EMAIL
        sync: false
      - key: CHURCH_ADMIN_PASSWORD
        sync: false
      - key: MARZPAY_API_BASE
        value: https://wallet.wearemarz.com/api/v1
      - key: MARZPAY_API_KEY
        sync: false
      - key: MARZPAY_API_SECRET
        sync: false
      - key: MARZPAY_WEBHOOK_SECRET
        sync: false
      - key: MARZPAY_CALLBACK_URL
        value: https://emmanuel-ministries.onrender.com/giving/webhook
      - key: MARZPAY_COUNTRY
        value: UG
      - key: MARZPAY_CURRENCY
        value: UGX
